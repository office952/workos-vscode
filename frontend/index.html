<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%VITE_APP_LOGO_URL%" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/workos-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WorkOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>erpWork OS</title>
    <meta name="description" content="erpWork OS — production management system" />
    <meta name="author" content="Atoms" />

    <meta property="og:title" content="erpWork OS" />
    <meta property="og:description" content="erpWork OS — production management system" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Apply stored theme before React paint so Day/Night tokens match on first frame -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("workos-theme");
          var resolved;
          if (stored === "light" || stored === "dark") {
            resolved = stored;
          } else if (stored === "system") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            // Match ThemeProvider defaultTheme="light"
            resolved = "light";
          }
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          root.setAttribute("data-theme", resolved);
          root.style.colorScheme = resolved;
        } catch (e) {
          var fallback = document.documentElement;
          fallback.classList.add("light");
          fallback.setAttribute("data-theme", "light");
          fallback.style.colorScheme = "light";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
