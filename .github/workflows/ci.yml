name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS — avoids Node 20 setup deprecation on Actions runners.
          # (Action *runtime* Node-20 warnings may remain until upstream action majors.)
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Unit tests (CI allowlist)
        run: pnpm run test:ci
      - name: Build
        run: pnpm run build

  backend-smoke:
    name: Backend targeted pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Targeted tests
        env:
          APP_ENV: test
          ENVIRONMENT: test
        run: >
          python -m pytest -q
          tests/test_capacity_shift_model.py
          tests/test_dashboard_kpi_metrics.py
          tests/test_operational_data_gaps.py
          tests/test_pricing_registry.py
          tests/test_cost_engine_config.py
          --ignore=tests/manual
